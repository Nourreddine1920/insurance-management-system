name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          version: '3.25.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake libsqlite3-dev clang-format cppcheck clang-tidy lcov

      - name: Configure build
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build --config Release

      - name: Run database migrations
        run: ./build/insurance_system --migrate

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run cppcheck
        run: cppcheck --enable=warning,performance,portability,information --std=c11 --force --inconclusive --xml --xml-version=2 src 2> build/cppcheck-report.xml

      - name: Run clang-tidy
        run: |
          find src include -name '*.c' -o -name '*.h' | xargs clang-tidy -p build -- -std=c11 || true

      - name: Check formatting
        run: |
          find src include -name '*.c' -o -name '*.h' | xargs clang-format -style=file --dry-run --Werror

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/**
            build/cppcheck-report.xml
