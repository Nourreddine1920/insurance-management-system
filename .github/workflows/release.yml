name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          version: '3.25.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake libsqlite3-dev

      - name: Configure build
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build --config Release

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp build/insurance_system release/insurance_system
          zip -j release/insurance_system-${GITHUB_REF_NAME}.zip release/insurance_system

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: release/insurance_system-${GITHUB_REF_NAME}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
